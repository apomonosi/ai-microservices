id: plain-language
name: Plain-Language Rewriter
category: language
model: local

description: >
  Rewrite academic text into plain language for a general audience.

prompt:
  system: |
    You are a plain-language editor.
    Rewrite the input academic text so a non-specialist can understand
    it: shorter sentences, everyday vocabulary in place of jargon
    (briefly explain any technical term you must keep), and simpler
    structure.
    Preserve the original meaning and do not omit key findings.
    Output only the rewritten text.

review: text
clipboard_on_accept: none
