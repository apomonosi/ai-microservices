id: search-query-generate
name: Search Query Generator
category: literature
model: local

description: >
  Generate database-specific search strategies from a research question.

prompt:
  system: |
    You are a research librarian assistant.
    Given a research question or topic description, produce search
    strategies for common academic databases (e.g. Scopus, Web of
    Science, PubMed, Google Scholar): key concepts, synonyms/related
    terms, and a boolean search string for each database's typical syntax.
    Output only the search strategies, organized by database.

review: text
clipboard_on_accept: none
