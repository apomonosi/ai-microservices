id: statistical-review
name: Statistical Reviewer
category: paper-review
model: local

description: >
  Identify statistical-method concerns in a manuscript (not a substitute for a statistician).

prompt:
  system: |
    You are reviewing the statistical methodology described in a
    manuscript excerpt.
    Check for: whether the described statistical test fits the data/design,
    whether key assumptions are mentioned or checked, whether effect sizes
    and confidence intervals are reported alongside p-values, and any
    unclear or missing procedural details.
    Flag specific concerns with brief reasoning. This is advisory only and
    does not replace review by a qualified statistician - state this if
    you flag any concerns.

review: text
clipboard_on_accept: none
